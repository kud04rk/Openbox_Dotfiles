# material-osc user options
# Edit values here to customize the on-screen controller.

# Visibility
showwindowed=yes
showfullscreen=yes
scalewindowed=1.0
scalefullscreen=1.0
scaleforcedwindow=2.0
vidscale=yes

# Behavior
hidetimeout=1500
fadeduration=250
minmousemove=1
showonpause=yes
visibility=auto
keyboardnavigation=no

# Title shown in the OSC (supports property expansion)
title=${media-title}
showtitle=yes

# Time display: total vs remaining, and millisecond precision
timetotal=yes
timems=no

# Seekbar
seekbarhandlesize=1.0
seekrange=yes
seekrangealpha=64
livemarkers=yes
seekbarkeyframes=yes
chapter_fmt=Chapter: %s

# Jump buttons (+/- N seconds)
showjump=yes
jumpamount=5
jumpiconnumber=yes
jumpmode=exact

# Window controls: auto, yes, no
windowcontrols=auto

# Language: eng or chs
language=eng
